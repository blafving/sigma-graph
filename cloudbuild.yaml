# CI/CD Pipeline: research-graph-sigma
# Triggers on push to main branch
# Builds React SPA and deploys to Cloud Storage + CDN

steps:
  # Step 1: Install dependencies
  - name: node:20-alpine
    id: install
    entrypoint: npm
    args: ['ci', '--prefer-offline']
    waitFor: ['-']

  # Step 2: Build production bundle
  - name: node:20-alpine
    id: build
    entrypoint: npm
    args: ['run', 'build']
    waitFor: ['install']

  # Step 3: Deploy to Cloud Storage bucket
  - name: google/cloud-sdk:slim
    id: deploy
    entrypoint: gsutil
    args: ['rsync', '-r', '-d', 'dist/', 'gs://research-graph-sigma/']
    waitFor: ['build']

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - "NODE_ENV=production"
